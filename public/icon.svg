<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#F2545B"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD45C"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#FFCB3D"/>
    </linearGradient>
  </defs>

  <!-- Fons (iOS ja arrodoneix les cantonades) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Confeti -->
  <g opacity="0.95">
    <circle cx="170" cy="200" r="26" fill="#FFC93C"/>
    <circle cx="860" cy="170" r="20" fill="#2EC4B6"/>
    <circle cx="880" cy="430" r="14" fill="#FFFFFF"/>
    <circle cx="130" cy="520" r="16" fill="#2EC4B6"/>
    <circle cx="900" cy="860" r="24" fill="#FFC93C"/>
    <circle cx="120" cy="880" r="18" fill="#FFFFFF"/>
    <rect x="745" y="270" width="54" height="20" rx="10" fill="#FFFFFF" transform="rotate(-30 772 280)"/>
    <rect x="215" y="330" width="54" height="20" rx="10" fill="#FFC93C" transform="rotate(35 242 340)"/>
    <rect x="820" y="640" width="54" height="20" rx="10" fill="#2EC4B6" transform="rotate(60 847 650)"/>
    <rect x="160" y="700" width="54" height="20" rx="10" fill="#FFFFFF" transform="rotate(-50 187 710)"/>
  </g>

  <!-- Ombra -->
  <ellipse cx="512" cy="852" rx="300" ry="34" fill="#3B0F6B" opacity="0.28"/>

  <!-- Llaç -->
  <g fill="#F2545B" stroke="#C93A41" stroke-width="10" stroke-linejoin="round">
    <path d="M512 400 C 430 300, 300 300, 320 370 C 335 420, 430 420, 512 400 Z"/>
    <path d="M512 400 C 594 300, 724 300, 704 370 C 689 420, 594 420, 512 400 Z"/>
  </g>
  <circle cx="512" cy="398" r="34" fill="#E2454D"/>

  <!-- Caixa -->
  <rect x="262" y="500" width="500" height="340" rx="36" fill="url(#box)"/>
  <!-- Tapa -->
  <rect x="228" y="410" width="568" height="120" rx="32" fill="url(#lid)"/>
  <rect x="228" y="500" width="568" height="30" fill="#E89B12" opacity="0.35"/>
  <!-- Cinta de la tapa -->
  <rect x="480" y="410" width="64" height="120" fill="#F2545B"/>

  <!-- Interrogant -->
  <text x="512" y="790" text-anchor="middle"
        font-family="Fredoka, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="700"
        font-size="300" fill="#7C3AED">?</text>
</svg>
